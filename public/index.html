<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WOND — Социальная сеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #e8edf3; display: flex; justify-content: center; min-height: 100vh; }
        
        #app { width: 100%; max-width: 1100px; min-height: 100vh; background: white; display: flex; }
        
        /* SIDEBAR */
        .sidebar {
            width: 260px; background: white; border-right: 1px solid #e8ecf0; 
            padding: 28px 0; display: flex; flex-direction: column;
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .sidebar .logo {
            padding: 0 24px 28px 24px; border-bottom: 2px solid #f0f2f5;
            display: flex; align-items: center; gap: 14px;
        }
        .sidebar .logo .icon {
            width: 48px; height: 48px; background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 24px; color: white;
        }
        .sidebar .logo h1 {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .sidebar .user-card {
            padding: 16px; margin: 0 12px 16px 12px;
            display: flex; align-items: center; gap: 16px;
            border-bottom: 2px solid #f0f2f5; cursor: pointer;
            border-radius: 12px; transition: 0.3s;
        }
        .sidebar .user-card:hover { background: #f8fafc; }
        .sidebar .user-card .avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 600; color: white;
        }
        .sidebar .user-card .info .name { font-weight: 700; font-size: 16px; color: #1a2634; }
        .sidebar .user-card .info .status { font-size: 12px; color: #7a8a9a; }
        
        .sidebar .nav { flex: 1; padding: 0 12px; }
        .sidebar .nav button {
            width: 100%; padding: 14px 18px; border: none; background: transparent;
            text-align: left; font-size: 15px; font-weight: 500; color: #4a5c6e;
            border-radius: 14px; cursor: pointer; display: flex; align-items: center;
            gap: 14px; transition: 0.3s;
        }
        .sidebar .nav button:hover { background: #f0f4f8; }
        .sidebar .nav button.active {
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white; box-shadow: 0 4px 16px rgba(74,118,168,0.3);
        }
        .sidebar .logout-btn {
            margin: 16px 20px 0 20px; padding: 14px;
            border: 2px solid #e8ecf0; background: transparent;
            border-radius: 14px; color: #e17055; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .sidebar .logout-btn:hover { background: #fef0ee; border-color: #e8b4b4; }
        
        /* MAIN */
        .main { flex: 1; padding: 24px 28px; background: #e8edf3; }
        
        /* AUTH */
        #authPanel {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; width: 100%;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
        }
        .auth-box {
            background: white; padding: 40px; border-radius: 20px;
            max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .auth-box .logo-big { text-align: center; margin-bottom: 28px; }
        .auth-box .logo-big .icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            border-radius: 20px; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 34px; color: white; font-weight: 800;
        }
        .auth-box .logo-big h1 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-top: 12px;
        }
        .auth-box .auth-tabs {
            display: flex; gap: 8px; margin-bottom: 24px;
            background: #f0f4f8; border-radius: 12px; padding: 4px;
        }
        .auth-box .auth-tabs button {
            flex: 1; padding: 10px; border: none; border-radius: 10px;
            font-weight: 600; cursor: pointer; background: transparent;
            color: #4a5c6e; transition: 0.3s;
        }
        .auth-box .auth-tabs button.active {
            background: white; color: #4a76a8; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .auth-box input {
            width: 100%; padding: 14px 18px; border: 2px solid #e8ecf0;
            border-radius: 14px; margin-bottom: 12px; font-size: 15px;
        }
        .auth-box input:focus { border-color: #4a76a8; outline: none; }
        .auth-box .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white; border: none; border-radius: 14px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        .auth-box .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(74,118,168,0.35); }
        .auth-box .msg { text-align: center; margin-top: 14px; font-size: 14px; color: #e17055; }
        .hidden { display: none !important; }
        
        /* WALL */
        .post-form {
            background: white; padding: 20px 24px; border-radius: 20px;
            margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .post-form textarea {
            width: 100%; border: 2px solid #e8ecf0; border-radius: 14px;
            padding: 14px; resize: vertical; font-size: 15px;
        }
        .post-form textarea:focus { border-color: #4a76a8; outline: none; }
        .post-form .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
        .post-form .actions button {
            padding: 10px 28px; background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white; border: none; border-radius: 30px; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .post-form .actions button:hover { transform: scale(1.02); }
        
        .post {
            background: white; padding: 18px 24px; border-radius: 20px;
            margin-bottom: 16px; border: 1px solid #e8ecf0;
        }
        .post .header { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
        .post .header .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 18px;
        }
        .post .header .author { font-weight: 700; color: #1a2634; cursor: pointer; }
        .post .header .time { font-size: 12px; color: #7a8a9a; margin-left: 10px; }
        .post .header .delete-btn {
            margin-left: auto; background: none; border: none;
            color: #b0c0d0; font-size: 20px; cursor: pointer;
        }
        .post .header .delete-btn:hover { color: #e17055; }
        .post .text { font-size: 15px; line-height: 1.7; color: #1a2634; }
        
        /* MESSENGER */
        .messenger-layout { display: flex; gap: 20px; height: 500px; }
        .user-list {
            width: 220px; background: white; border-radius: 20px;
            padding: 12px; overflow-y: auto; border: 1px solid #e8ecf0;
        }
        .user-list .item {
            padding: 12px 14px; border-radius: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 12px;
            transition: 0.3s; margin-bottom: 4px;
        }
        .user-list .item:hover { background: #f0f4f8; }
        .user-list .item.active {
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white;
        }
        .user-list .item .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 16px;
        }
        .user-list .item .name { flex: 1; font-weight: 500; }
        .user-list .item .badge {
            background: #e17055; color: white; border-radius: 50%;
            padding: 0 10px; font-size: 12px;
        }
        
        .chat-area {
            flex: 1; background: white; border-radius: 20px;
            display: flex; flex-direction: column; border: 1px solid #e8ecf0;
            overflow: hidden;
        }
        .chat-area .empty {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: #7a8a9a; font-size: 15px;
        }
        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }
        .chat-messages .msg {
            max-width: 75%; padding: 12px 18px; border-radius: 18px;
            font-size: 14px; line-height: 1.5;
        }
        .chat-messages .msg.out {
            align-self: flex-end;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white;
        }
        .chat-messages .msg.in {
            align-self: flex-start; background: #f0f4f8;
            color: #1a2634;
        }
        .chat-messages .msg .meta { font-size: 11px; opacity: 0.7; margin-top: 4px; }
        .chat-input {
            display: flex; gap: 12px; padding: 16px 20px;
            border-top: 1px solid #e8ecf0;
        }
        .chat-input input {
            flex: 1; padding: 12px 18px; border: 2px solid #e8ecf0;
            border-radius: 30px; font-size: 14px;
        }
        .chat-input input:focus { border-color: #4a76a8; outline: none; }
        .chat-input button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white; border: none; border-radius: 30px;
            font-weight: 600; cursor: pointer;
        }
        .chat-input button:hover { transform: scale(1.02); }
        
        /* PROFILE */
        .profile-card {
            background: white; border-radius: 20px; padding: 28px 32px;
            margin-bottom: 24px; border: 1px solid #e8ecf0;
        }
        .profile-card .profile-header {
            display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
        }
        .profile-card .profile-avatar {
            width: 120px; height: 120px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; color: white; font-weight: 700;
        }
        .profile-card .profile-info .name { font-size: 28px; font-weight: 800; color: #1a2634; }
        .profile-card .profile-info .login { color: #7a8a9a; font-size: 16px; }
        .profile-card .profile-info .bio { margin-top: 10px; color: #4a5c6e; }
        .profile-card .profile-stats {
            display: flex; gap: 40px; margin-top: 18px;
        }
        .profile-card .profile-stats .num { font-size: 24px; font-weight: 700; color: #1a2634; }
        .profile-card .profile-stats .label { font-size: 13px; color: #7a8a9a; }
        
        .profile-actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .profile-actions button {
            padding: 10px 28px; border: none; border-radius: 30px;
            font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .profile-actions .friend-add {
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white;
        }
        .profile-actions .friend-remove { background: #e17055; color: white; }
        .profile-actions .friend-pending {
            background: #e8ecf0; color: #7a8a9a; cursor: default;
        }
        
        /* GROUPS */
        .groups-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px; margin-top: 16px;
        }
        .group-card {
            background: white; border-radius: 20px; padding: 24px;
            text-align: center; border: 1px solid #e8ecf0;
            transition: 0.3s; cursor: pointer;
        }
        .group-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .group-card .group-icon {
            width: 64px; height: 64px; border-radius: 50%;
            margin: 0 auto 14px; display: flex;
            align-items: center; justify-content: center;
            font-size: 28px; color: white; font-weight: 700;
        }
        .group-card .group-name { font-weight: 700; font-size: 17px; color: #1a2634; }
        .group-card .group-members { font-size: 13px; color: #7a8a9a; margin-top: 6px; }
        
        .create-group-form {
            background: white; border-radius: 20px; padding: 20px 24px;
            margin-bottom: 24px; display: flex; gap: 12px;
            flex-wrap: wrap; align-items: center; border: 1px solid #e8ecf0;
        }
        .create-group-form input {
            flex: 1; padding: 12px 18px; border: 2px solid #e8ecf0;
            border-radius: 30px; font-size: 14px; min-width: 150px;
        }
        .create-group-form button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white; border: none; border-radius: 30px;
            font-weight: 600; cursor: pointer;
        }
        
        /* FRIENDS */
        .friends-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px; margin-top: 16px;
        }
        .friend-card {
            background: white; border-radius: 20px; padding: 20px;
            text-align: center; border: 1px solid #e8ecf0;
            transition: 0.3s; cursor: pointer;
        }
        .friend-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .friend-card .avatar {
            width: 64px; height: 64px; border-radius: 50%;
            margin: 0 auto 12px; display: flex;
            align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 24px;
        }
        .friend-card .name { font-weight: 600; font-size: 15px; color: #1a2634; }
        .friend-card .status { font-size: 12px; color: #7a8a9a; margin-top: 4px; }
        
        /* FOOTER */
        .footer {
            margin-top: 32px; padding: 20px 0; text-align: center;
            border-top: 1px solid #e8ecf0; color: #7a8a9a; font-size: 14px;
        }
        .footer .ceo {
            font-weight: 700; color: #4a76a8;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .footer .stats {
            display: inline-block; background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white; padding: 2px 16px; border-radius: 30px;
            font-size: 13px; margin-left: 12px; font-weight: 600;
        }
        
        /* CALL OVERLAY */
        .call-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; flex-direction: column; gap: 30px;
        }
        .call-overlay.active { display: flex; }
        .call-overlay .call-container {
            background: white; border-radius: 20px; padding: 40px;
            max-width: 400px; width: 90%; text-align: center;
        }
        .call-overlay .call-avatar {
            width: 100px; height: 100px; border-radius: 50%;
            margin: 0 auto 20px; display: flex; align-items: center;
            justify-content: center; font-size: 40px; color: white; font-weight: 700;
        }
        .call-overlay .call-name { font-size: 24px; font-weight: 700; color: #1a2634; }
        .call-overlay .call-status { color: #7a8a9a; margin-top: 8px; font-size: 16px; }
        .call-overlay .call-actions {
            display: flex; gap: 16px; justify-content: center; margin-top: 24px;
        }
        .call-overlay .call-actions button {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            font-size: 28px; cursor: pointer; transition: 0.3s;
        }
        .call-overlay .call-actions button:hover { transform: scale(1.1); }
        .call-overlay .call-actions .call-end { background: #e17055; color: white; }
        .call-overlay .call-actions .call-end:hover { background: #c0392b; }
        .call-overlay .call-actions .call-accept { background: #00b894; color: white; }
        .call-overlay .call-actions .call-accept:hover { background: #00a383; }
        
        /* VERIFICATION MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white; border-radius: 20px; padding: 40px;
            max-width: 400px; width: 90%; text-align: center;
        }
        .modal-box h2 { font-size: 24px; color: #1a2634; margin-bottom: 12px; }
        .modal-box p { color: #7a8a9a; margin-bottom: 20px; }
        .modal-box input {
            width: 100%; padding: 14px 18px; border: 2px solid #e8ecf0;
            border-radius: 14px; font-size: 18px; text-align: center;
            letter-spacing: 8px; margin-bottom: 16px;
        }
        .modal-box .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #4a76a8, #6c5ce7);
            color: white; border: none; border-radius: 14px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .modal-box .btn-secondary {
            width: 100%; padding: 14px; background: transparent;
            color: #4a5c6e; border: 2px solid #e8ecf0;
            border-radius: 14px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 10px;
        }
        .modal-box .msg { margin-top: 12px; font-size: 14px; }
        .modal-box .msg.success { color: #00b894; }
        .modal-box .msg.error { color: #e17055; }
        
        .connection-status {
            position: fixed; bottom: 20px; right: 20px;
            padding: 8px 16px; border-radius: 30px; font-size: 12px;
            font-weight: 600; z-index: 1000;
        }
        .connection-status.online { background: #00b894; color: white; }
        .connection-status.offline { background: #e17055; color: white; }
        
        @media (max-width: 768px) {
            .sidebar { width: 72px; }
            .sidebar .logo h1, .sidebar .logo .icon { display: none; }
            .sidebar .user-card .info { display: none; }
            .sidebar .nav button .label { display: none; }
            .sidebar .nav button .emoji { font-size: 20px; }
            .sidebar .logout-btn span { display: none; }
            .main { padding: 14px; }
            .messenger-layout { flex-direction: column; height: auto; }
            .user-list { width: 100%; max-height: 160px; }
            .profile-card .profile-header { flex-direction: column; text-align: center; }
            .profile-card .profile-stats { justify-content: center; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar" style="display:none;">
        <div class="logo">
            <div class="icon">W</div>
            <h1>WOND</h1>
        </div>
        <div class="user-card" id="userCard">
            <div class="avatar" id="sidebarAvatar">?</div>
            <div class="info">
                <div class="name" id="sidebarName">User</div>
                <div class="status">Онлайн</div>
            </div>
        </div>
        <div class="nav">
            <button class="active" data-tab="wall"><span class="emoji">📰</span><span class="label">Стена</span></button>
            <button data-tab="profile"><span class="emoji">👤</span><span class="label">Профиль</span></button>
            <button data-tab="friends"><span class="emoji">🤝</span><span class="label">Друзья</span></button>
            <button data-tab="groups"><span class="emoji">👥</span><span class="label">Группы</span></button>
            <button data-tab="messages"><span class="emoji">💬</span><span class="label">Сообщения</span></button>
        </div>
        <button class="logout-btn" id="logoutBtn">🚪 <span>Выйти</span></button>
    </div>
    
    <!-- MAIN -->
    <div class="main" id="mainContent" style="display:none;">
        <!-- Wall -->
        <div id="wallPanel">
            <div class="post-form">
                <textarea id="postInput" rows="2" placeholder="Что у вас нового?"></textarea>
                <div class="actions">
                    <button id="postBtn">📤 Опубликовать</button>
                </div>
            </div>
            <div id="wallFeed"></div>
        </div>
        
        <!-- Profile -->
        <div id="profilePanel" style="display:none;">
            <div class="profile-card" id="profileCard"></div>
            <div id="profilePosts"></div>
        </div>
        
        <!-- Friends -->
        <div id="friendsPanel" style="display:none;">
            <div id="friendsList" class="friends-grid"></div>
        </div>
        
        <!-- Groups -->
        <div id="groupsPanel" style="display:none;">
            <div class="create-group-form">
                <input type="text" id="groupNameInput" placeholder="Название группы..." />
                <button id="createGroupBtn">➕ Создать</button>
            </div>
            <div id="groupsList" class="groups-grid"></div>
        </div>
        
        <!-- Messages -->
        <div id="messagesPanel" style="display:none;">
            <div class="messenger-layout">
                <div class="user-list" id="userList"></div>
                <div class="chat-area">
                    <div class="chat-messages" id="chatMessages">
                        <div class="empty">💬 Выберите собеседника</div>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="Напишите сообщение..." />
                        <button id="sendMsgBtn">➤</button>
                        <button id="callBtn" style="background:linear-gradient(135deg,#4a76a8,#6c5ce7);color:white;border:none;border-radius:30px;padding:12px 20px;font-size:18px;cursor:pointer;">📞</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- FOOTER -->
        <div class="footer">
            <span>© 2026 WOND</span> &nbsp;•&nbsp; <span class="ceo">CEO: LEV USKOV</span>
            <span class="stats" id="userCountStats">👥 0</span>
        </div>
    </div>
    
    <!-- AUTH -->
    <div id="authPanel">
        <div class="auth-box">
            <div class="logo-big">
                <div class="icon">W</div>
                <h1>WOND</h1>
                <p>социальная сеть нового поколения</p>
            </div>
            <div class="auth-tabs">
                <button class="active" data-tab="login">Вход</button>
                <button data-tab="register">Регистрация</button>
            </div>
            <div class="auth-form" id="loginForm">
                <input type="text" id="loginInput" placeholder="👤 Логин или Email" />
                <input type="password" id="passInput" placeholder="🔒 Пароль" />
                <button class="btn-primary" id="loginBtn">Войти</button>
                <div class="msg" id="loginMessage"></div>
            </div>
            <div class="auth-form hidden" id="registerForm">
                <input type="text" id="regLoginInput" placeholder="👤 Логин" />
                <input type="email" id="regEmailInput" placeholder="📧 Email" />
                <input type="password" id="regPassInput" placeholder="🔒 Пароль (мин. 6 символов)" />
                <input type="password" id="regPassConfirmInput" placeholder="🔒 Повторите пароль" />
                <button class="btn-primary" id="registerBtn">Создать аккаунт</button>
                <div class="msg" id="registerMessage"></div>
            </div>
        </div>
    </div>
    
    <!-- VERIFICATION MODAL -->
    <div class="modal-overlay" id="verifyModal">
        <div class="modal-box">
            <h2>📧 Подтверждение email</h2>
            <p>Введите код из письма</p>
            <input type="text" id="verifyCodeInput" placeholder="Код" maxlength="6" />
            <button class="btn-primary" id="verifyBtn">Подтвердить</button>
            <div class="msg" id="verifyMessage"></div>
        </div>
    </div>
    
    <!-- CALL OVERLAY -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-container">
            <div class="call-avatar" id="callAvatar">?</div>
            <div class="call-name" id="callName">User</div>
            <div class="call-status" id="callStatus">Звонок...</div>
            <div class="call-actions" id="callActions">
                <button class="call-end" id="callEndBtn">❌</button>
            </div>
        </div>
    </div>
    
    <div class="connection-status offline" id="connectionStatus">🔴 Offline</div>
</div>

<script>
// ============================================================
//  ГЛАВНЫЙ JS
// ============================================================
const API_URL = window.location.origin;
let currentUser = null;
let currentUserId = null;
let selectedChatUser = null;
let ws = null;
let wsConnected = false;
let viewingProfile = null;
let peerConnection = null;
let localStream = null;
let isCallActive = false;
let currentCallTarget = null;

// ============================================================
//  API
// ============================================================
async function apiCall(endpoint, method = 'GET', data = null) {
    const token = localStorage.getItem('wond_token');
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (token) options.headers['Authorization'] = `Bearer ${token}`;
    if (data) options.body = JSON.stringify(data);
    const res = await fetch(`${API_URL}${endpoint}`, options);
    return res.json();
}

// ============================================================
//  АВАТАРКИ
// ============================================================
const colors = ['#4a76a8','#6c5ce7','#e17055','#00b894','#fd79a8','#0984e3','#fdcb6e','#e84393','#00cec9'];
function getColor(login) {
    let hash = 0;
    for (let i = 0; i < login.length; i++) hash = login.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}
function getInitials(login) { return login.charAt(0).toUpperCase(); }
function renderAvatar(login, size = 44, container = null) {
    const el = document.createElement('div');
    el.className = 'avatar';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = (size * 0.45) + 'px';
    el.style.background = getColor(login);
    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.style.justifyContent = 'center';
    el.style.color = 'white';
    el.style.fontWeight = '600';
    el.style.flexShrink = '0';
    el.style.borderRadius = '50%';
    el.textContent = getInitials(login);
    if (container) { container.innerHTML = ''; container.appendChild(el); }
    return el;
}

// ============================================================
//  АВТОРИЗАЦИЯ
// ============================================================
document.querySelectorAll('.auth-tabs button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const tab = this.dataset.tab;
        document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
        document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
    });
});

document.getElementById('registerBtn').addEventListener('click', async () => {
    const login = document.getElementById('regLoginInput').value.trim();
    const email = document.getElementById('regEmailInput').value.trim();
    const pass = document.getElementById('regPassInput').value;
    const passConfirm = document.getElementById('regPassConfirmInput').value;
    const msg = document.getElementById('registerMessage');
    if (!login || !email || !pass || !passConfirm) { msg.textContent = '❌ Заполните все поля'; return; }
    if (pass.length < 6) { msg.textContent = '❌ Пароль минимум 6 символов'; return; }
    if (pass !== passConfirm) { msg.textContent = '❌ Пароли не совпадают'; return; }
    const result = await apiCall('/api/register', 'POST', { login, email, password: pass });
    if (result.success) {
        localStorage.setItem('wond_token', result.token);
        currentUser = result.user.login;
        currentUserId = result.user.id;
        msg.textContent = '✅ Проверьте почту для подтверждения';
        document.getElementById('verifyModal').classList.add('active');
        setTimeout(() => { showApp(); connectWS(); }, 1500);
    } else {
        msg.textContent = '❌ ' + (result.error || 'Ошибка');
    }
});

document.getElementById('loginBtn').addEventListener('click', async () => {
    const login = document.getElementById('loginInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const msg = document.getElementById('loginMessage');
    if (!login || !pass) { msg.textContent = '❌ Заполните все поля'; return; }
    const result = await apiCall('/api/login', 'POST', { login, password: pass });
    if (result.success) {
        localStorage.setItem('wond_token', result.token);
        currentUser = result.user.login;
        currentUserId = result.user.id;
        msg.textContent = '✅ Вход выполнен!';
        showApp();
        connectWS();
    } else {
        msg.textContent = '❌ ' + (result.error || 'Неверный логин или пароль');
    }
});

document.getElementById('verifyBtn').addEventListener('click', async () => {
    const code = document.getElementById('verifyCodeInput').value.trim();
    const msg = document.getElementById('verifyMessage');
    if (!code || code.length !== 6) { msg.textContent = '❌ Введите 6-значный код'; return; }
    const result = await apiCall('/api/verify', 'POST', { code });
    if (result.success) {
        msg.textContent = '✅ Email подтверждён!';
        msg.className = 'msg success';
        setTimeout(() => { document.getElementById('verifyModal').classList.remove('active'); }, 1500);
    } else {
        msg.textContent = '❌ ' + (result.error || 'Неверный код');
        msg.className = 'msg error';
    }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('wond_token');
    currentUser = null;
    currentUserId = null;
    document.getElementById('authPanel').style.display = 'flex';
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('mainContent').style.display = 'none';
    if (ws) ws.close();
});

async function showApp() {
    document.getElementById('authPanel').style.display = 'none';
    document.getElementById('sidebar').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('sidebarName').textContent = currentUser;
    renderAvatar(currentUser, 56, document.getElementById('sidebarAvatar'));
    loadWall();
    loadUserList();
    updateUserCount();
    switchTab('wall');
}

async function restoreSession() {
    const token = localStorage.getItem('wond_token');
    if (!token) return false;
    const result = await apiCall('/api/verify-token', 'GET');
    if (result.valid) {
        currentUser = result.user.login;
        currentUserId = result.user.id;
        showApp();
        connectWS();
        return true;
    }
    return false;
}

// ============================================================
//  WEBSOCKET
// ============================================================
function connectWS() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}`);
    ws.onopen = () => {
        wsConnected = true;
        document.getElementById('connectionStatus').className = 'connection-status online';
        document.getElementById('connectionStatus').textContent = '🟢 Online';
        ws.send(JSON.stringify({ type: 'auth', token: localStorage.getItem('wond_token') }));
    };
    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        console.log('WS:', data.type);
        switch(data.type) {
            case 'call_offer':
                handleCallOffer(data);
                break;
            case 'call_answer':
                handleCallAnswer(data);
                break;
            case 'ice_candidate':
                handleIceCandidate(data);
                break;
            case 'call_end':
                endCall();
                break;
            case 'new_message':
                loadChat();
                break;
        }
    };
    ws.onclose = () => {
        wsConnected = false;
        document.getElementById('connectionStatus').className = 'connection-status offline';
        document.getElementById('connectionStatus').textContent = '🔴 Offline';
        setTimeout(connectWS, 3000);
    };
}

// ============================================================
//  СТЕНА
// ============================================================
async function loadWall() {
    const feed = document.getElementById('wallFeed');
    const result = await apiCall('/api/posts');
    const posts = result.posts || [];
    if (!posts.length) {
        feed.innerHTML = '<div style="text-align:center;color:#7a8a9a;padding:40px;">✨ Здесь пока пусто</div>';
        return;
    }
    feed.innerHTML = '';
    for (const p of posts) {
        const div = document.createElement('div');
        div.className = 'post';
        const header = document.createElement('div');
        header.className = 'header';
        const av = document.createElement('div');
        renderAvatar(p.author, 44, av);
        header.appendChild(av);
        const info = document.createElement('div');
        info.innerHTML = `<span class="author">${p.author}</span><span class="time">${p.created_at ? new Date(p.created_at).toLocaleString() : ''}</span>`;
        header.appendChild(info);
        if (p.author_id === currentUserId) {
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.textContent = '✕';
            del.onclick = async () => { await apiCall('/api/posts/' + p.id, 'DELETE'); loadWall(); };
            header.appendChild(del);
        }
        div.appendChild(header);
        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = p.text;
        div.appendChild(text);
        feed.appendChild(div);
    }
}

document.getElementById('postBtn').addEventListener('click', async () => {
    const text = document.getElementById('postInput').value.trim();
    if (!text) return;
    await apiCall('/api/posts', 'POST', { text });
    document.getElementById('postInput').value = '';
    loadWall();
});

// ============================================================
//  ПРОФИЛЬ
// ============================================================
async function viewProfile(userId) {
    viewingProfile = userId;
    switchTab('profile');
    const result = await apiCall('/api/users/' + userId);
    const user = result.user;
    if (!user) return;
    const card = document.getElementById('profileCard');
    const av = document.createElement('div');
    av.className = 'profile-avatar';
    renderAvatar(user.login, 120, av);
    const postsResult = await apiCall('/api/posts');
    const userPosts = (postsResult.posts || []).filter(p => p.author_id === userId);
    const friendsResult = await apiCall('/api/friends');
    const friendsCount = (friendsResult.friends || []).length;
    const isFriend = (friendsResult.friends || []).some(f => f.id === userId);
    const requestsResult = await apiCall('/api/friends/requests');
    const hasPending = (requestsResult.requests || []).some(r => r.from === userId);
    let actions = '';
    if (userId !== currentUserId) {
        if (isFriend) {
            actions = `<button class="friend-remove" onclick="removeFriend('${userId}')">❌ Удалить из друзей</button>`;
        } else if (hasPending) {
            actions = `<button class="friend-pending">⏳ Заявка отправлена</button>`;
        } else {
            actions = `<button class="friend-add" onclick="addFriend('${userId}')">➕ Добавить в друзья</button>`;
        }
    }
    card.innerHTML = `
        <div class="profile-header">
            ${av.outerHTML}
            <div class="profile-info">
                <div class="name">${user.login}</div>
                <div class="login">@${user.login}</div>
                <div class="bio">${user.bio || '🌟 Пользователь WOND'}</div>
                <div class="profile-stats">
                    <div><div class="num">${userPosts.length}</div><div class="label">Постов</div></div>
                    <div><div class="num">${friendsCount}</div><div class="label">Друзей</div></div>
                </div>
                <div class="profile-actions">${actions}</div>
            </div>
        </div>
    `;
}

async function addFriend(userId) {
    await apiCall('/api/friends/request', 'POST', { targetId: userId });
    viewProfile(userId);
}
async function removeFriend(userId) {
    if (confirm('Удалить из друзей?')) {
        await apiCall('/api/friends/remove', 'POST', { friendId: userId });
        viewProfile(userId);
    }
}

// ============================================================
//  ДРУЗЬЯ
// ============================================================
async function loadFriends() {
    const container = document.getElementById('friendsList');
    const result = await apiCall('/api/friends');
    const friends = result.friends || [];
    if (!friends.length) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#7a8a9a;padding:40px;">🤝 Нет друзей</div>';
        return;
    }
    container.innerHTML = '';
    for (const f of friends) {
        const card = document.createElement('div');
        card.className = 'friend-card';
        card.onclick = () => viewProfile(f.id);
        const av = document.createElement('div');
        av.className = 'avatar';
        renderAvatar(f.login, 64, av);
        card.appendChild(av);
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = f.login;
        card.appendChild(name);
        container.appendChild(card);
    }
}

// ============================================================
//  ГРУППЫ
// ============================================================
async function loadGroups() {
    const container = document.getElementById('groupsList');
    const result = await apiCall('/api/groups');
    const groups = result.groups || [];
    if (!groups.length) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#7a8a9a;padding:40px;">👥 Групп пока нет</div>';
        return;
    }
    container.innerHTML = '';
    for (const g of groups) {
        const card = document.createElement('div');
        card.className = 'group-card';
        const icon = document.createElement('div');
        icon.className = 'group-icon';
        icon.style.background = getColor(g.name);
        icon.textContent = g.name.charAt(0).toUpperCase();
        const name = document.createElement('div');
        name.className = 'group-name';
        name.textContent = g.name;
        const members = document.createElement('div');
        members.className = 'group-members';
        members.textContent = `👥 Создатель: ${g.creator_login || 'Unknown'}`;
        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(members);
        container.appendChild(card);
    }
}

document.getElementById('createGroupBtn').addEventListener('click', async () => {
    const name = document.getElementById('groupNameInput').value.trim();
    if (!name) { alert('Введите название'); return; }
    await apiCall('/api/groups', 'POST', { name });
    document.getElementById('groupNameInput').value = '';
    loadGroups();
});

// ============================================================
//  СООБЩЕНИЯ
// ============================================================
async function loadUserList() {
    const result = await apiCall('/api/users');
    const users = result.users || [];
    const list = document.getElementById('userList');
    if (!users.length) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:#7a8a9a;">👤 Нет других пользователей</div>';
        return;
    }
    list.innerHTML = '';
    for (const u of users) {
        const item = document.createElement('div');
        item.className = 'item' + (selectedChatUser === u.id ? ' active' : '');
        const av = document.createElement('div');
        renderAvatar(u.login, 40, av);
        item.appendChild(av);
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = u.login;
        item.appendChild(name);
        item.onclick = () => {
            selectedChatUser = u.id;
            loadUserList();
            loadChat();
        };
        list.appendChild(item);
    }
}

async function loadChat() {
    const container = document.getElementById('chatMessages');
    if (!selectedChatUser) {
        container.innerHTML = '<div class="empty">💬 Выберите собеседника</div>';
        return;
    }
    const result = await apiCall('/api/messages/' + selectedChatUser);
    const msgs = result.messages || [];
    container.innerHTML = '';
    for (const m of msgs) {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.from_user === currentUserId ? 'out' : 'in');
        div.innerHTML = `${m.text}<div class="meta">${m.from_login || 'Unknown'} • ${new Date(m.created_at).toLocaleString()}</div>`;
        container.appendChild(div);
    }
    container.scrollTop = container.scrollHeight;
}

document.getElementById('sendMsgBtn').addEventListener('click', async () => {
    if (!selectedChatUser) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    await apiCall('/api/messages/' + selectedChatUser, 'POST', { text });
    input.value = '';
    loadChat();
});

// ============================================================
//  ЗВОНКИ (WebRTC)
// ============================================================
const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

document.getElementById('callBtn').addEventListener('click', () => {
    if (!selectedChatUser) { alert('Выберите собеседника'); return; }
    startCall(selectedChatUser);
});

async function startCall(targetId) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        localStream = stream;
        peerConnection = new RTCPeerConnection(configuration);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        peerConnection.onicecandidate = (e) => {
            if (e.candidate) {
                ws.send(JSON.stringify({ type: 'ice_candidate', targetId, candidate: e.candidate }));
            }
        };
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'call_offer', targetId, offer, callType: 'audio' }));
        showCallUI('audio', targetId, false);
    } catch (err) { alert('Нет доступа к микрофону'); }
}

async function handleCallOffer(data) {
    currentCallTarget = data.from;
    showCallUI('audio', data.from, true);
    window.pendingOffer = data.offer;
}

async function acceptCall() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        localStream = stream;
        peerConnection = new RTCPeerConnection(configuration);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        peerConnection.onicecandidate = (e) => {
            if (e.candidate) {
                ws.send(JSON.stringify({ type: 'ice_candidate', targetId: currentCallTarget, candidate: e.candidate }));
            }
        };
        await peerConnection.setRemoteDescription(new RTCSessionDescription(window.pendingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'call_answer', targetId: currentCallTarget, answer }));
        document.getElementById('callStatus').textContent = '📞 В разговоре';
        isCallActive = true;
    } catch (err) { endCall(); }
}

async function handleCallAnswer(data) {
    try {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById('callStatus').textContent = '📞 В разговоре';
        isCallActive = true;
    } catch (err) { endCall(); }
}

async function handleIceCandidate(data) {
    try {
        if (peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    } catch (err) {}
}

function endCall() {
    isCallActive = false;
    if (peerConnection) { peerConnection.close(); peerConnection = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    document.getElementById('callOverlay').classList.remove('active');
    if (currentCallTarget) {
        ws.send(JSON.stringify({ type: 'call_end', targetId: currentCallTarget }));
    }
    currentCallTarget = null;
}

function showCallUI(type, user, incoming) {
    const overlay = document.getElementById('callOverlay');
    overlay.classList.add('active');
    const avatar = document.getElementById('callAvatar');
    const name = document.getElementById('callName');
    const status = document.getElementById('callStatus');
    const actions = document.getElementById('callActions');
    renderAvatar(user, 100, avatar);
    name.textContent = user;
    if (incoming) {
        status.textContent = '📞 Входящий звонок...';
        actions.innerHTML = `
            <button class="call-accept" id="callAcceptBtn">📞</button>
            <button class="call-end" id="callEndBtn">❌</button>
        `;
        document.getElementById('callAcceptBtn').onclick = acceptCall;
        document.getElementById('callEndBtn').onclick = endCall;
    } else {
        status.textContent = '⏳ Вызов...';
        actions.innerHTML = `<button class="call-end" id="callEndBtn">❌</button>`;
        document.getElementById('callEndBtn').onclick = endCall;
    }
}

document.getElementById('callEndBtn').onclick = endCall;

// ============================================================
//  ВКЛАДКИ
// ============================================================
function switchTab(tab) {
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('wallPanel').style.display = tab === 'wall' ? 'block' : 'none';
    document.getElementById('profilePanel').style.display = tab === 'profile' ? 'block' : 'none';
    document.getElementById('friendsPanel').style.display = tab === 'friends' ? 'block' : 'none';
    document.getElementById('groupsPanel').style.display = tab === 'groups' ? 'block' : 'none';
    document.getElementById('messagesPanel').style.display = tab === 'messages' ? 'block' : 'none';
    if (tab === 'wall') loadWall();
    if (tab === 'profile') viewProfile(currentUserId);
    if (tab === 'friends') loadFriends();
    if (tab === 'groups') loadGroups();
    if (tab === 'messages') { loadUserList(); loadChat(); }
}

document.querySelectorAll('.nav button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('userCard').addEventListener('click', () => {
    viewingProfile = currentUserId;
    switchTab('profile');
});

async function updateUserCount() {
    const result = await apiCall('/api/users');
    document.getElementById('userCountStats').textContent = `👥 ${(result.users || []).length + 1}`;
}

// ============================================================
//  ЗАПУСК
// ============================================================
(async function init() {
    const restored = await restoreSession();
    if (!restored) {
        document.getElementById('authPanel').style.display = 'flex';
        document.getElementById('sidebar').style.display = 'none';
        document.getElementById('mainContent').style.display = 'none';
    }
})();

console.log('🚀 WOND запущен!');
console.log('👨‍💼 CEO: LEV USKOV');
</script>
