<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WOND — социальная сеть</title>
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --primary: #4a76a8;
            --primary-dark: #3b5f8a;
            --secondary: #6c5ce7;
            --gradient: linear-gradient(135deg, #4a76a8, #6c5ce7);
            --gradient-hover: linear-gradient(135deg, #3b5f8a, #5a4bd1);
            --bg: #e8edf3;
            --card-bg: #ffffff;
            --text-primary: #1a2634;
            --text-secondary: #4a5c6e;
            --text-muted: #7a8a9a;
            --border: #e8ecf0;
            --shadow: 0 8px 32px rgba(74, 118, 168, 0.12);
            --shadow-hover: 0 12px 48px rgba(74, 118, 168, 0.20);
            --radius: 20px;
            --radius-sm: 14px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background:var(--bg); display:flex; justify-content:center; min-height:100vh; }
        
        #app { width:100%; max-width:1100px; min-height:100vh; display:flex; background:var(--card-bg); border-radius:0; overflow:hidden; box-shadow:var(--shadow); position:relative; }
        
        /* ===== SIDEBAR ===== */
        .sidebar {
            width:260px; background:var(--card-bg); border-right:1px solid var(--border); padding:28px 0; display:flex; flex-direction:column; flex-shrink:0;
            position:sticky; top:0; height:100vh; overflow-y:auto;
        }
        .sidebar .logo {
            padding:0 24px 28px 24px; border-bottom:2px solid var(--border); margin-bottom:24px; display:flex; align-items:center; gap:14px;
        }
        .sidebar .logo .icon {
            width:48px; height:48px; background:var(--gradient); border-radius:16px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px; color:white; box-shadow:0 4px 16px rgba(74,118,168,0.35); transition:var(--transition);
        }
        .sidebar .logo .icon:hover { transform:scale(1.05) rotate(-3deg); }
        .sidebar .logo h1 { font-size:28px; font-weight:800; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.5px; }
        .sidebar .logo .wond-dot { display:inline-block; width:8px; height:8px; background:var(--gradient); border-radius:50%; margin-left:2px; }
        
        .sidebar .user-card {
            padding:0 20px 24px 20px; border-bottom:2px solid var(--border); margin-bottom:20px; display:flex; align-items:center; gap:16px; cursor:pointer; transition:var(--transition); border-radius:12px; margin:0 12px 16px 12px; padding:16px;
        }
        .sidebar .user-card:hover { background:#f8fafc; transform:translateX(4px); }
        .sidebar .user-card .avatar {
            width:56px; height:56px; border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:600; color:white; flex-shrink:0; object-fit:cover; border:3px solid rgba(74,118,168,0.15); transition:var(--transition);
        }
        .sidebar .user-card .avatar:hover { transform:scale(1.05); border-color:var(--primary); }
        .sidebar .user-card .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .sidebar .user-card .info { flex:1; min-width:0; }
        .sidebar .user-card .info .name { font-weight:700; font-size:16px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .sidebar .user-card .info .status { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
        .sidebar .user-card .info .status .online { width:8px; height:8px; background:#00b894; border-radius:50%; display:inline-block; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        
        .sidebar .nav {
            flex:1; padding:0 12px;
        }
        .sidebar .nav button {
            width:100%; padding:14px 18px; border:none; background:transparent; text-align:left; font-size:15px; font-weight:500; color:var(--text-secondary); border-radius:14px; margin-bottom:4px; cursor:pointer; display:flex; align-items:center; gap:14px; transition:var(--transition); position:relative;
        }
        .sidebar .nav button:hover { background:#f0f4f8; transform:translateX(4px); }
        .sidebar .nav button.active { background:var(--gradient); color:white; box-shadow:0 4px 16px rgba(74,118,168,0.30); }
        .sidebar .nav button.active .emoji { filter:brightness(10); }
        .sidebar .nav button .emoji { font-size:20px; width:28px; text-align:center; transition:var(--transition); }
        .sidebar .nav button .label { transition:var(--transition); }
        .sidebar .nav button .badge { margin-left:auto; background:#e17055; color:white; border-radius:50%; padding:2px 10px; font-size:12px; font-weight:600; }
        .sidebar .nav button.active .badge { background:rgba(255,255,255,0.25); }
        
        .sidebar .logout-btn {
            margin:16px 20px 0 20px; padding:14px; border:2px solid var(--border); background:transparent; border-radius:14px; color:#e17055; font-weight:600; cursor:pointer; transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:10px;
        }
        .sidebar .logout-btn:hover { background:#fef0ee; border-color:#e8b4b4; transform:translateY(-2px); box-shadow:0 4px 16px rgba(225,112,85,0.15); }
        
        /* ===== MAIN ===== */
        .main { flex:1; padding:24px 28px; min-width:0; display:flex; flex-direction:column; background:var(--bg); }
        
        /* ===== SEARCH ===== */
        .search-bar {
            background:var(--card-bg); border-radius:var(--radius); padding:14px 20px; margin-bottom:24px; box-shadow:0 2px 8px rgba(0,0,0,0.04);
            display:flex; gap:12px; align-items:center; flex-wrap:wrap; border:1px solid var(--border); transition:var(--transition);
        }
        .search-bar:focus-within { border-color:var(--primary); box-shadow:0 0 0 4px rgba(74,118,168,0.08); }
        .search-bar input {
            flex:1; padding:12px 18px; border:2px solid var(--border); border-radius:30px; font-size:14px; min-width:150px; transition:var(--transition); background:var(--bg);
        }
        .search-bar input:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 4px rgba(74,118,168,0.08); background:white; }
        .search-bar select {
            padding:12px 18px; border:2px solid var(--border); border-radius:30px; font-size:14px; background:var(--bg); cursor:pointer; transition:var(--transition);
        }
        .search-bar select:focus { border-color:var(--primary); outline:none; }
        .search-bar button {
            padding:12px 28px; background:var(--gradient); color:white; border:none; border-radius:30px; font-weight:600; cursor:pointer; transition:var(--transition);
        }
        .search-bar button:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(74,118,168,0.30); }
        .search-results {
            background:var(--card-bg); border-radius:var(--radius); padding:16px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.04); display:none; border:1px solid var(--border);
        }
        .search-results .result-item {
            padding:12px 16px; border-radius:var(--radius-sm); display:flex; align-items:center; gap:14px; cursor:pointer; transition:var(--transition);
        }
        .search-results .result-item:hover { background:#f0f4f8; transform:translateX(4px); }
        .search-results .result-item .avatar {
            width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:600; font-size:16px; flex-shrink:0;
        }
        .search-results .result-item .info { flex:1; }
        .search-results .result-item .info .name { font-weight:600; font-size:15px; color:var(--text-primary); }
        .search-results .result-item .info .desc { font-size:13px; color:var(--text-muted); }
        
        /* ===== AUTH ===== */
        #authPanel { display:flex; justify-content:center; align-items:center; min-height:100vh; width:100%; background:var(--gradient); position:relative; overflow:hidden; }
        #authPanel::before { content:''; position:absolute; width:600px; height:600px; background:rgba(255,255,255,0.05); border-radius:50%; top:-200px; right:-200px; }
        #authPanel::after { content:''; position:absolute; width:400px; height:400px; background:rgba(255,255,255,0.03); border-radius:50%; bottom:-100px; left:-100px; }
        .auth-box { background:rgba(255,255,255,0.95); backdrop-filter:blur(20px); padding:48px 40px; border-radius:var(--radius); max-width:420px; width:100%; box-shadow:0 24px 80px rgba(0,0,0,0.20); position:relative; z-index:1; border:1px solid rgba(255,255,255,0.2); }
        .auth-box .logo-big { text-align:center; margin-bottom:32px; }
        .auth-box .logo-big .icon { width:72px; height:72px; background:var(--gradient); border-radius:20px; display:inline-flex; align-items:center; justify-content:center; font-size:34px; color:white; font-weight:800; box-shadow:0 8px 32px rgba(74,118,168,0.35); }
        .auth-box .logo-big h1 { font-size:36px; font-weight:800; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-top:12px; }
        .auth-box .logo-big p { color:var(--text-muted); font-size:15px; }
        .auth-box input { width:100%; padding:16px 20px; border:2px solid var(--border); border-radius:var(--radius-sm); margin-bottom:14px; font-size:15px; transition:var(--transition); background:white; }
        .auth-box input:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 4px rgba(74,118,168,0.10); }
        .auth-box .btn-primary { width:100%; padding:16px; background:var(--gradient); color:white; border:none; border-radius:var(--radius-sm); font-size:16px; font-weight:600; cursor:pointer; transition:var(--transition); }
        .auth-box .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(74,118,168,0.35); }
        .auth-box .btn-secondary { width:100%; padding:16px; background:transparent; color:var(--primary); border:2px solid var(--border); border-radius:var(--radius-sm); font-size:16px; font-weight:600; cursor:pointer; transition:var(--transition); margin-top:10px; }
        .auth-box .btn-secondary:hover { background:#f0f4f8; border-color:var(--primary); }
        .auth-box .msg { text-align:center; margin-top:16px; font-size:14px; color:#e17055; min-height:20px; }
        .hidden { display:none !important; }
        
        /* ===== WALL ===== */
        .post-form { background:var(--card-bg); padding:24px; border-radius:var(--radius); box-shadow:0 2px 8px rgba(0,0,0,0.04); margin-bottom:24px; border:1px solid var(--border); transition:var(--transition); }
        .post-form:focus-within { border-color:var(--primary); box-shadow:var(--shadow); }
        .post-form textarea { width:100%; border:2px solid var(--border); border-radius:var(--radius-sm); padding:16px; resize:vertical; font-size:15px; transition:var(--transition); background:var(--bg); }
        .post-form textarea:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 4px rgba(74,118,168,0.08); background:white; }
        .post-form .actions { display:flex; justify-content:flex-end; margin-top:14px; gap:12px; }
        .post-form .actions button { padding:12px 32px; background:var(--gradient); color:white; border:none; border-radius:30px; font-weight:600; cursor:pointer; transition:var(--transition); }
        .post-form .actions button:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(74,118,168,0.30); }
        
        .post { background:var(--card-bg); padding:20px 24px; border-radius:var(--radius); box-shadow:0 2px 8px rgba(0,0,0,0.04); margin-bottom:16px; transition:var(--transition); border:1px solid var(--border); }
        .post:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
        .post .header { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
        .post .header .avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:600; font-size:18px; flex-shrink:0; cursor:pointer; transition:var(--transition); }
        .post .header .avatar:hover { transform:scale(1.05); }
        .post .header .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .post .header .info { flex:1; }
        .post .header .info .author { font-weight:700; color:var(--text-primary); font-size:15px; cursor:pointer; transition:var(--transition); }
        .post .header .info .author:hover { color:var(--primary); }
        .post .header .info .time { font-size:12px; color:var(--text-muted); margin-left:10px; }
        .post .header .delete-btn { background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; padding:0 8px; transition:var(--transition); }
        .post .header .delete-btn:hover { color:#e17055; transform:scale(1.15); }
        .post .text { font-size:15px; line-height:1.7; color:var(--text-primary); word-wrap:break-word; }
        .post .group-tag { display:inline-block; background:var(--gradient); color:white; padding:4px 16px; border-radius:30px; font-size:12px; font-weight:600; margin-top:10px; }
        
        /* ===== PROFILE ===== */
        .profile-card {
            background:var(--card-bg); border-radius:var(--radius); padding:32px; box-shadow:0 2px 8px rgba(0,0,0,0.04); margin-bottom:24px; border:1px solid var(--border); transition:var(--transition);
        }
        .profile-card:hover { box-shadow:var(--shadow); }
        .profile-card .profile-header { display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
        .profile-card .profile-avatar { width:120px; height:120px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:48px; font-weight:700; color:white; flex-shrink:0; border:4px solid rgba(74,118,168,0.15); transition:var(--transition); cursor:pointer; }
        .profile-card .profile-avatar:hover { transform:scale(1.02); border-color:var(--primary); }
        .profile-card .profile-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .profile-card .profile-info { flex:1; }
        .profile-card .profile-info .name { font-size:30px; font-weight:800; color:var(--text-primary); }
        .profile-card .profile-info .login { color:var(--text-muted); font-size:16px; }
        .profile-card .profile-info .bio { margin-top:10px; color:var(--text-secondary); font-size:15px; }
        .profile-card .profile-stats { display:flex; gap:40px; margin-top:18px; flex-wrap:wrap; }
        .profile-card .profile-stats div { text-align:center; cursor:pointer; transition:var(--transition); padding:8px 12px; border-radius:12px; }
        .profile-card .profile-stats div:hover { background:#f0f4f8; }
        .profile-card .profile-stats .num { font-size:24px; font-weight:700; color:var(--text-primary); }
        .profile-card .profile-stats .label { font-size:13px; color:var(--text-muted); }
        
        .profile-actions { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
        .profile-actions button { padding:10px 28px; border:none; border-radius:30px; font-weight:600; cursor:pointer; transition:var(--transition); }
        .profile-actions .friend-add { background:var(--gradient); color:white; }
        .profile-actions .friend-add:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(74,118,168,0.30); }
        .profile-actions .friend-remove { background:#e17055; color:white; }
        .profile-actions .friend-remove:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(225,112,85,0.30); }
        .profile-actions .friend-pending { background:var(--border); color:var(--text-muted); cursor:default; }
        
        /* ===== FRIENDS LIST ===== */
        .friends-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; margin-top:16px; }
        .friend-card {
            background:var(--card-bg); border-radius:var(--radius); padding:20px; text-align:center; border:1px solid var(--border); transition:var(--transition); cursor:pointer;
        }
        .friend-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
        .friend-card .avatar { width:64px; height:64px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:24px; }
        .friend-card .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .friend-card .name { font-weight:600; font-size:15px; color:var(--text-primary); }
        .friend-card .status { font-size:12px; color:var(--text-muted); margin-top:4px; }
        
        /* ===== GROUPS ===== */
        .groups-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-top:16px; }
        .group-card {
            background:var(--card-bg); border-radius:var(--radius); padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.04); text-align:center; transition:var(--transition); cursor:pointer; border:1px solid var(--border); position:relative;
        }
        .group-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
        .group-card .group-icon { width:64px; height:64px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; font-weight:700; transition:var(--transition); }
        .group-card .group-icon:hover { transform:scale(1.05); }
        .group-card .group-name { font-weight:700; font-size:17px; color:var(--text-primary); }
        .group-card .group-members { font-size:13px; color:var(--text-muted); margin-top:6px; }
        .group-card .group-btn { margin-top:14px; padding:8px 24px; border:none; border-radius:30px; font-weight:600; cursor:pointer; transition:var(--transition); }
        .group-card .group-btn.join { background:var(--gradient); color:white; }
        .group-card .group-btn.join:hover { transform:scale(1.02); box-shadow:0 4px 16px rgba(74,118,168,0.30); }
        .group-card .group-btn.leave { background:var(--border); color:var(--text-secondary); }
        .group-card .group-btn.leave:hover { background:#d5dde8; }
        .group-card .group-delete { position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer; font-size:16px; color:var(--text-muted); transition:var(--transition); }
        .group-card .group-delete:hover { color:#e17055; transform:scale(1.1); }
        
        .create-group-form { background:var(--card-bg); border-radius:var(--radius); padding:20px 24px; box-shadow:0 2px 8px rgba(0,0,0,0.04); margin-bottom:24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; border:1px solid var(--border); }
        .create-group-form input { flex:1; padding:12px 18px; border:2px solid var(--border); border-radius:30px; font-size:14px; min-width:150px; transition:var(--transition); background:var(--bg); }
        .create-group-form input:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 4px rgba(74,118,168,0.08); background:white; }
        .create-group-form button { padding:12px 28px; background:var(--gradient); color:white; border:none; border-radius:30px; font-weight:600; cursor:pointer; transition:var(--transition); }
        .create-group-form button:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(74,118,168,0.30); }
        
        /* ===== MESSENGER ===== */
        .messenger-layout { display:flex; gap:20px; height:calc(100vh - 180px); min-height:420px; }
        .user-list { width:220px; background:var(--card-bg); border-radius:var(--radius); padding:12px; overflow-y:auto; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.04); border:1px solid var(--border); }
        .user-list .item { padding:12px 14px; border-radius:var(--radius-sm); cursor:pointer; display:flex; align-items:center; gap:12px; transition:var(--transition); margin-bottom:4px; }
        .user-list .item:hover { background:#f0f4f8; transform:translateX(4px); }
        .user-list .item.active { background:var(--gradient); color:white; }
        .user-list .item.active .name { color:white; }
        .user-list .item .avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:600; font-size:16px; flex-shrink:0; }
        .user-list .item .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .user-list .item .name { flex:1; font-weight:500; font-size:14px; color:var(--text-primary); }
        .user-list .item .badge { background:#e17055; color:white; border-radius:50%; padding:0 10px; font-size:12px; font-weight:600; }
        .user-list .item.active .badge { background:rgba(255,255,255,0.25); }
        
        .chat-area { flex:1; background:var(--card-bg); border-radius:var(--radius); display:flex; flex-direction:column; box-shadow:0 2px 8px rgba(0,0,0,0.04); overflow:hidden; border:1px solid var(--border); }
        .chat-area .empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-muted); font-size:15px; flex-direction:column; gap:10px; }
        .chat-area .empty .icon { font-size:56px; opacity:0.2; }
        .chat-messages { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; background:var(--bg); }
        .chat-messages .msg { max-width:75%; padding:14px 20px; border-radius:18px; font-size:14px; line-height:1.6; word-wrap:break-word; animation:slideIn 0.2s ease; }
        @keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .chat-messages .msg.out { align-self:flex-end; background:var(--gradient); color:white; border-bottom-right-radius:4px; }
        .chat-messages .msg.in { align-self:flex-start; background:var(--card-bg); color:var(--text-primary); border-bottom-left-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
        .chat-messages .msg .meta { font-size:11px; opacity:0.7; margin-top:6px; display:flex; gap:8px; align-items:center; }
        .chat-input { display:flex; gap:12px; padding:16px 20px; border-top:1px solid var(--border); background:var(--card-bg); }
        .chat-input input { flex:1; padding:12px 20px; border:2px solid var(--border); border-radius:30px; font-size:14px; transition:var(--transition); background:var(--bg); }
        .chat-input input:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 4px rgba(74,118,168,0.08); background:white; }
        .chat-input button { padding:12px 28px; background:var(--gradient); color:white; border:none; border-radius:30px; font-weight:600; cursor:pointer; transition:var(--transition); }
        .chat-input button:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(74,118,168,0.30); }
        
        /* ===== CALL UI ===== */
        .call-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(20px);
            display:none; justify-content:center; align-items:center; z-index:9999; flex-direction:column; gap:30px;
        }

<script>
// ============================================================
//  WEBSOCKET + WEBRTC
// ============================================================
let ws = null;
let peerConnection = null;
let localStream = null;
let remoteStream = null;
let isCallActive = false;
let callType = 'audio';
let callIncoming = false;
let callTimeout = null;
let currentCallTarget = null;
let wsConnected = false;

// ============================================================
//  ПОДКЛЮЧЕНИЕ К WEBSOCKET
// ============================================================
function connectWebSocket() {
    // Для локальной разработки
    const wsUrl = 'ws://localhost:3000';
    // Для продакшена: wss://your-domain.com
    
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
        console.log('✅ WebSocket подключен');
        wsConnected = true;
        document.getElementById('connectionStatus').className = 'connection-status online';
        document.getElementById('connectionStatus').textContent = '🟢 Online';
        
        // Отправляем логин
        if (currentUser) {
            ws.send(JSON.stringify({
                type: 'login',
                login: currentUser
            }));
        }
    };
    
    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        console.log('📨 Получено:', data);
        
        switch(data.type) {
            case 'users':
                // Обновляем список пользователей
                break;
                
            case 'call_offer':
                handleCallOffer(data);
                break;
                
            case 'call_answer':
                handleCallAnswer(data);
                break;
                
            case 'ice_candidate':
                handleIceCandidate(data);
                break;
                
            case 'call_end':
                handleCallEnd();
                break;
                
            case 'call_reject':
                handleCallReject();
                break;
                
            case 'error':
                alert(data.message);
                endCall();
                break;
        }
    };
    
    ws.onclose = () => {
        console.log('❌ WebSocket отключен');
        wsConnected = false;
        document.getElementById('connectionStatus').className = 'connection-status offline';
        document.getElementById('connectionStatus').textContent = '🔴 Offline';
        setTimeout(connectWebSocket, 3000);
    };
    
    ws.onerror = (error) => {
        console.error('WebSocket ошибка:', error);
    };
}

function sendWS(data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
    } else {
        console.warn('WebSocket не подключен');
    }
}

// ============================================================
//  WEBRTC
// ============================================================
const configuration = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
    ]
};

async function createPeerConnection() {
    peerConnection = new RTCPeerConnection(configuration);
    
    peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
            sendWS({
                type: 'ice_candidate',
                candidate: event.candidate,
                target: currentCallTarget
            });
        }
    };
    
    peerConnection.ontrack = (event) => {
        remoteStream = event.streams[0];
        document.getElementById('remoteVideo').srcObject = remoteStream;
        document.getElementById('remoteVideo').style.display = 'block';
    };
    
    peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'connected') {
            document.getElementById('callStatus').textContent = '📞 В разговоре';
        } else if (peerConnection.connectionState === 'disconnected') {
            endCall();
        }
    };
    
    return peerConnection;
}

async function startCall(target, type) {
    if (!wsConnected) {
        alert('Нет соединения с сервером');
        return;
    }
    
    callType = type;
    currentCallTarget = target;
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: type === 'video'
        });
        localStream = stream;
        
        if (type === 'video') {
            document.getElementById('localVideo').srcObject = stream;
            document.getElementById('localVideo').style.display = 'block';
        }
        
        const pc = await createPeerConnection();
        localStream.getTracks().forEach(track => {
            pc.addTrack(track, localStream);
        });
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        sendWS({
            type: 'call_offer',
            target: target,
            offer: offer,
            callType: type
        });
        
        showCallUI(type, target, false);
        document.getElementById('callStatus').textContent = '⏳ Ожидание ответа...';
        isCallActive = true;
        
        callTimeout = setTimeout(() => {
            if (isCallActive) {
                document.getElementById('callStatus').textContent = '❌ Нет ответа';
                setTimeout(() => endCall(), 2000);
            }
        }, 15000);
        
    } catch (err) {
        console.error('Ошибка доступа к медиа:', err);
        alert('Нет доступа к микрофону/камере');
        endCall();
    }
}

async function handleCallOffer(data) {
    callIncoming = true;
    currentCallTarget = data.from;
    callType = data.callType || 'audio';
    
    // Показываем входящий звонок
    showCallUI(callType, data.from, true);
    document.getElementById('callStatus').textContent = '📞 Входящий звонок...';
    
    // Сохраняем offer для ответа
    window.pendingOffer = data.offer;
}

async function acceptCall() {
    if (!window.pendingOffer) return;
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: callType === 'video'
        });
        localStream = stream;
        
        if (callType === 'video') {
            document.getElementById('localVideo').srcObject = stream;
            document.getElementById('localVideo').style.display = 'block';
        }
        
        const pc = await createPeerConnection();
        localStream.getTracks().forEach(track => {
            pc.addTrack(track, localStream);
        });
        
        await pc.setRemoteDescription(new RTCSessionDescription(window.pendingOffer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        
        sendWS({
            type: 'call_answer',
            target: currentCallTarget,
            answer: answer
        });
        
        document.getElementById('callActions').innerHTML = `
            <button class="call-end" id="callEndBtn">❌</button>
            <button class="call-mute" id="callMuteBtn">🔊</button>
            ${callType === 'video' ? '<button class="call-video" id="callVideoToggleBtn">📹</button>' : ''}
        `;
        document.getElementById('callEndBtn').onclick = () => endCall();
        document.getElementById('callMuteBtn').onclick = toggleMute;
        if (callType === 'video') {
            document.getElementById('callVideoToggleBtn').onclick = toggleVideo;
        }
        
        document.getElementById('callStatus').textContent = '📞 Соединение...';
        isCallActive = true;
        callIncoming = false;
        window.pendingOffer = null;
        
    } catch (err) {
        console.error('Ошибка принятия звонка:', err);
        endCall();
    }
}

async function handleCallAnswer(data) {
    try {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById('callStatus').textContent = '📞 Соединение установлено';
        if (callTimeout) {
            clearTimeout(callTimeout);
            callTimeout = null;
        }
        
        document.getElementById('callActions').innerHTML = `
            <button class="call-end" id="callEndBtn">❌</button>
            <button class="call-mute" id="callMuteBtn">🔊</button>
            ${callType === 'video' ? '<button class="call-video" id="callVideoToggleBtn">📹</button>' : ''}
        `;
        document.getElementById('callEndBtn').onclick = () => endCall();
        document.getElementById('callMuteBtn').onclick = toggleMute;
        if (callType === 'video') {
            document.getElementById('callVideoToggleBtn').onclick = toggleVideo;
        }
        
    } catch (err) {
        console.error('Ошибка установки ответа:', err);
    }
}

async function handleIceCandidate(data) {
    try {
        if (peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    } catch (err) {
        console.error('Ошибка добавления ICE кандидата:', err);
    }
}

function handleCallEnd() {
    endCall();
}

function handleCallReject() {
    document.getElementById('callStatus').textContent = '❌ Звонок отклонён';
    setTimeout(() => endCall(), 1500);
}

function endCall() {
    isCallActive = false;
    callIncoming = false;
    
    if (callTimeout) {
        clearTimeout(callTimeout);
        callTimeout = null;
    }
    
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }
    
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }
    
    if (remoteStream) {
        remoteStream.getTracks().forEach(track => track.stop());
        remoteStream = null;
    }
    
    document.getElementById('localVideo').srcObject = null;
    document.getElementById('localVideo').style.display = 'none';
    document.getElementById('remoteVideo').srcObject = null;
    document.getElementById('remoteVideo').style.display = 'none';
    document.getElementById('callVideoContainer').style.display = 'none';
    document.getElementById('callContainer').style.display = 'block';
    
    // Отправляем сигнал о завершении
    if (currentCallTarget) {
        sendWS({
            type: 'call_end',
            target: currentCallTarget
        });
    }
    
    currentCallTarget = null;
    window.pendingOffer = null;
    
    setTimeout(() => {
        hideCallUI();
    }, 500);
}

function toggleMute() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        const btn = document.getElementById('callMuteBtn');
        btn.textContent = audioTrack.enabled ? '🔊' : '🔇';
        btn.classList.toggle('active', !audioTrack.enabled);
    }
}

function toggleVideo() {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        const btn = document.getElementById('callVideoToggleBtn');
        btn.textContent = videoTrack.enabled ? '📹' : '🚫';
        btn.classList.toggle('active', !videoTrack.enabled);
    }
}

// ============================================================
//  UI ЗВОНКА
// ============================================================
function showCallUI(type, user, incoming) {
    const overlay = document.getElementById('callOverlay');
    overlay.classList.add('active');
    
    const container = document.getElementById('callContainer');
    const videoContainer = document.getElementById('callVideoContainer');
    const avatar = document.getElementById('callAvatar');
    const name = document.getElementById('callName');
    const status = document.getElementById('callStatus');
    const actions = document.getElementById('callActions');
    
    renderAvatar(user, 100, avatar);
    name.textContent = user;
    
    if (incoming) {
        status.textContent = '📞 Входящий звонок...';
        actions.innerHTML = `
            <button class="call-accept" id="callAcceptBtn">📞</button>
            <button class="call-end" id="callEndBtn">❌</button>
        `;
        document.getElementById('callAcceptBtn').onclick = () => acceptCall();
        document.getElementById('callEndBtn').onclick = () => {
            sendWS({
                type: 'call_reject',
                target: currentCallTarget
            });
            endCall();
        };
    }
    
    if (type === 'video') {
        videoContainer.style.display = 'flex';
        document.getElementById('localVideo').style.display = 'block';
    } else {
        videoContainer.style.display = 'none';
    }
}

function hideCallUI() {
    document.getElementById('callOverlay').classList.remove('active');
    document.getElementById('callVideoContainer').style.display = 'none';
}

// ============================================================
//  БАЗА ДАННЫХ (IndexedDB) - СОКРАЩЕННАЯ ВЕРСИЯ
// ============================================================
class WondDB {
    constructor() {
        this.db = null;
        this.ready = new Promise((resolve) => {
            const req = indexedDB.open('WondDB', 4);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('users')) {
                    const users = db.createObjectStore('users', { keyPath: 'login' });
                    users.createIndex('friends', 'friends', { unique: false });
                }
                if (!db.objectStoreNames.contains('posts')) {
                    const posts = db.createObjectStore('posts', { keyPath: 'id', autoIncrement: true });
                    posts.createIndex('author', 'author', { unique: false });
                }
                if (!db.objectStoreNames.contains('messages')) {
                    const msgs = db.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
                    msgs.createIndex('chatKey', 'chatKey', { unique: false });
                }
                if (!db.objectStoreNames.contains('avatars')) {
                    db.createObjectStore('avatars', { keyPath: 'login' });
                }
                if (!db.objectStoreNames.contains('groups')) {
                    const groups = db.createObjectStore('groups', { keyPath: 'id', autoIncrement: true });
                    groups.createIndex('name', 'name', { unique: false });
                }
                if (!db.objectStoreNames.contains('friendRequests')) {
                    const reqs = db.createObjectStore('friendRequests', { keyPath: 'id', autoIncrement: true });
                    reqs.createIndex('to', 'to', { unique: false });
                    reqs.createIndex('from', 'from', { unique: false });
                }
            };
            req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
            req.onerror = () => { resolve(); };
        });
    }
    
    async get(store, key) {
        await this.ready;
        return new Promise((resolve) => {
            const tx = this.db.transaction(store, 'readonly');
            const req = tx.objectStore(store).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }
    
    async getAll(store, index, value) {
        await this.ready;
        return new Promise((resolve) => {
            const tx = this.db.transaction(store, 'readonly');
            let req;
            if (index && value !== undefined) {
                req = tx.objectStore(store).index(index).getAll(value);
            } else {
                req = tx.objectStore(store).getAll();
            }
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
        });
    }
    
    async put(store, data) {
        await this.ready;
        return new Promise((resolve) => {
            const tx = this.db.transaction(store, 'readwrite');
            const req = tx.objectStore(store).put(data);
            req.onsuccess = () => resolve(req.result);
        });
    }
    
    async delete(store, key) {
        await this.ready;
        return new Promise((resolve) => {
            const tx = this.db.transaction(store, 'readwrite');
            tx.objectStore(store).delete(key);
            tx.oncomplete = () => resolve();
        });
    }
}

const db = new WondDB();

// ============================================================

// ============================================================
let currentUser = null;
let selectedChatUser = null;
let allUsers = [];
let allGroups = [];
let viewingProfile = null;

// ============================================================

const defaultColors = ['#4a76a8','#6c5ce7','#e17055','#00b894','#fd79a8','#0984e3','#fdcb6e','#e84393','#00cec9','#6c5ce7'];

function getAvatarColor(login) {
    let hash = 0;
    for (let i = 0; i < login.length; i++) hash = login.charCodeAt(i) + ((hash << 5) - hash);
    return defaultColors[Math.abs(hash) % defaultColors.length];
}

function getInitials(login) {
    return login.charAt(0).toUpperCase();
}

async function getAvatarUrl(login) {
    const av = await db.get('avatars', login);
    return av ? av.dataUrl : null;
}

async function setAvatar(login, dataUrl) {
    await db.put('avatars', { login, dataUrl });
}

function renderAvatar(login, size = 44, container = null) {
    const el = document.createElement('div');
    el.className = 'avatar';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = (size * 0.45) + 'px';
    el.style.background = getAvatarColor(login);
    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.style.justifyContent = 'center';
    el.style.color = 'white';
    el.style.fontWeight = '600';
    el.style.flexShrink = '0';
    el.style.borderRadius = '50%';
    el.textContent = getInitials(login);
    
    getAvatarUrl(login).then(url => {
        if (url) {
            const img = document.createElement('img');
            img.src = url;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.borderRadius = '50%';
            img.style.objectFit = 'cover';
            el.innerHTML = '';
            el.style.background = 'transparent';
            el.appendChild(img);
        }
    });
    
    if (container) {
        container.innerHTML = '';
        container.appendChild(el);
    }
    return el;
}

async function loadUsers() {
    allUsers = await db.getAll('users');
}

async function loadGroups() {

// ============================================================
//  СИСТЕМА ДРУЗЕЙ (СОКРАЩЕННО)
// ============================================================
async function getFriendRequests(toUser) {
    const all = await db.getAll('friendRequests', 'to', toUser);
    return all.filter(r => r.status === 'pending');
}

async function sendFriendRequest(from, to) {
    const existing = await db.getAll('friendRequests');
    const found = existing.find(r => r.from === from && r.to === to && r.status === 'pending');
    if (found) return false;
    await db.put('friendRequests', { from, to, status: 'pending', created: new Date().toLocaleString() });
    return true;
}

async function acceptFriendRequest(requestId) {
    const req = await db.get('friendRequests', requestId);
    if (!req) return false;
    req.status = 'accepted';
    await db.put('friendRequests', req);
    
    const user1 = await db.get('users', req.from);
    const user2 = await db.get('users', req.to);
    if (user1 && user2) {
        if (!user1.friends) user1.friends = [];
        if (!user2.friends) user2.friends = [];
        if (!user1.friends.includes(req.to)) user1.friends.push(req.to);
        if (!user2.friends.includes(req.from)) user2.friends.push(req.from);
        await db.put('users', user1);
        await db.put('users', user2);
    }
    return true;
}

async function rejectFriendRequest(requestId) {
    await db.delete('friendRequests', requestId);
    return true;
}

async function removeFriend(userLogin, friendLogin) {
    const user = await db.get('users', userLogin);
    const friend = await db.get('users', friendLogin);
    if (user && user.friends) {
        user.friends = user.friends.filter(f => f !== friendLogin);
        await db.put('users', user);
    }
    if (friend && friend.friends) {
        friend.friends = friend.friends.filter(f => f !== userLogin);
        await db.put('users', friend);
    }
    const allReqs = await db.getAll('friendRequests');
    for (const r of allReqs) {
        if ((r.from === userLogin && r.to === friendLogin) || (r.from === friendLogin && r.to === userLogin)) {
            await db.delete('friendRequests', r.id);
        }
    }
    return true;
}

async function isFriend(userLogin, friendLogin) {
    const user = await db.get('users', userLogin);
    return user && user.friends && user.friends.includes(friendLogin);
}

async function getFriendsCount(login) {
    const user = await db.get('users', login);
    return user && user.friends ? user.friends.length : 0;
}

async function getFriendRequestsCount(login) {
    const reqs = await getFriendRequests(login);
    return reqs.length;
}

// ============================================================
async function login(login, password) {
    await loadUsers();
    const user = allUsers.find(u => u.login === login && u.password === password);
    if (user) {
        currentUser = login;
        localStorage.setItem('wond_session', login);
        localStorage.setItem('wond_user', JSON.stringify({ login }));
        showApp();
        if (wsConnected) {
            sendWS({ type: 'login', login: currentUser });
        }
        return true;
    }
    return false;
}

async function register(login, password) {
    await loadUsers();
    if (allUsers.find(u => u.login === login)) return false;
    await db.put('users', { login, password, friends: [] });
    currentUser = login;
    localStorage.setItem('wond_session', login);
    localStorage.setItem('wond_user', JSON.stringify({ login }));
    showApp();
    if (wsConnected) {
        sendWS({ type: 'login', login: currentUser });
    }
    return true;
}

function logout() {
    currentUser = null;
    selectedChatUser = null;
    viewingProfile = null;
    localStorage.removeItem('wond_session');
    localStorage.removeItem('wond_user');
    document.getElementById('authPanel').style.display = 'flex';
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('mainContent').style.display = 'none';
    if (wsConnected) {
        sendWS({ type: 'logout', login: currentUser });
    }
    endCall();
}

function showApp() {
    document.getElementById('authPanel').style.display = 'none';
    document.getElementById('sidebar').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('sidebarName').textContent = currentUser;
    renderAvatar(currentUser, 56, document.getElementById('sidebarAvatar'));
    updateBadges();
    loadWall();
    loadUserList();
    loadGroups();
    updateUserCount();
    if (viewingProfile) {
        switchTab('profile');
    } else {
        switchTab('wall');
    }
}

async function restoreSession() {
    const saved = localStorage.getItem('wond_session');
    if (saved) {
        await loadUsers();
        const user = allUsers.find(u => u.login === saved);
        if (user) {
            currentUser = saved;
            showApp();
            return true;
        }
    }
    return false;
}

async function updateBadges() {
    if (!currentUser) return;
    const requests = await getFriendRequestsCount(currentUser);
    const badge = document.getElementById('friendRequestsBadge');
    if (requests > 0) {
        badge.style.display = 'inline';
        badge.textContent = requests;
    } else {
        badge.style.display = 'none';
    }
}

async function updateUserCount() {
    await loadUsers();
    document.getElementById('userCountStats').textContent = `👥 ${allUsers.length}`;
}

async function loadWall() {
    const feed = document.getElementById('wallFeed');
    let posts = await db.getAll('posts');
    if (viewingProfile) {
        posts = posts.filter(p => p.author === viewingProfile);
    }
    if (!posts.length) {
        feed.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:48px;font-size:16px;">✨ Здесь пока пусто. Напишите первый пост!</div>';
        return;
    }
    const sorted = posts.slice().reverse();
    feed.innerHTML = '';
    for (const p of sorted) {
        const div = document.createElement('div');
        div.className = 'post';
        const header = document.createElement('div');
        header.className = 'header';
        const avDiv = document.createElement('div');
        renderAvatar(p.author, 44, avDiv);
        avDiv.onclick = () => { viewProfile(p.author); };
        header.appendChild(avDiv);
        const info = document.createElement('div');
        info.className = 'info';
        const authorSpan = document.createElement('span');
        authorSpan.className = 'author';
        authorSpan.textContent = p.author;
        authorSpan.onclick = () => { viewProfile(p.author); };
        info.appendChild(authorSpan);
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = p.time;
        info.appendChild(timeSpan);
        header.appendChild(info);
        if (p.author === currentUser && !viewingProfile) {
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.textContent = '✕';
            del.onclick = async () => {
                await db.delete('posts', p.id);
                loadWall();
            };
            header.appendChild(del);
        }
        div.appendChild(header);
        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = p.text;
        div.appendChild(text);
        if (p.group) {
            const tag = document.createElement('div');
            tag.className = 'group-tag';
            tag.textContent = '📌 ' + p.group;
            div.appendChild(tag);
        }
        feed.appendChild(div);
    }
}

document.getElementById('postBtn').addEventListener('click', async () => {
    const text = document.getElementById('postInput').value.trim();
    if (!text) return;
    await db.put('posts', {
        author: currentUser,
        text: text,

//  ПРОФИЛЬ (СОКРАЩЕННО)
// ============================================================
async function viewProfile(login) {
    viewingProfile = login;
    switchTab('profile');
    await loadUsers();
    const user = allUsers.find(u => u.login === login);
    if (!user) return;
    
    const card = document.getElementById('profileCard');
    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'profile-avatar';
    renderAvatar(login, 120, avatarDiv);
    avatarDiv.onclick = () => {
        if (login === currentUser) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const dataUrl = ev.target.result;
                    await setAvatar(currentUser, dataUrl);
                    renderAvatar(currentUser, 56, document.getElementById('sidebarAvatar'));
                    viewProfile(currentUser);
                    loadWall();
                    loadUserList();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }
    };
    
    const posts = await db.getAll('posts');
    const userPosts = posts.filter(p => p.author === login);
    const friendsCount = await getFriendsCount(login);
    const isFriendWith = await isFriend(currentUser, login);
    const requests = await getFriendRequests(currentUser);
    const hasPending = requests.some(r => r.from === login);
    
    let actionsHtml = '';
    if (login !== currentUser) {
        if (isFriendWith) {
            actionsHtml = `<div class="profile-actions">
                <button class="friend-remove" onclick="removeFriendAction('${login}')">❌ Удалить из друзей</button>
            </div>`;
        } else if (hasPending) {
            actionsHtml = `<div class="profile-actions">
                <button class="friend-pending">⏳ Заявка отправлена</button>
            </div>`;
        } else {
            actionsHtml = `<div class="profile-actions">
                <button class="friend-add" onclick="addFriendAction('${login}')">➕ Добавить в друзья</button>
            </div>`;
        }
    }
    
    card.innerHTML = `
        <div class="profile-header">
            ${avatarDiv.outerHTML}
            <div class="profile-info">
                <div class="name">${login}</div>
                <div class="login">@${login}</div>
                <div class="bio">${user.bio || '🌟 Пользователь WOND'}</div>
                <div class="profile-stats">
                    <div onclick="viewProfile('${login}')"><div class="num">${userPosts.length}</div><div class="label">Постов</div></div>
                    <div onclick="showFriendsList('${login}')"><div class="num">${friendsCount}</div><div class="label">Друзей</div></div>
                    <div><div class="num">${allUsers.length - 1}</div><div class="label">Пользователей</div></div>
                </div>
                ${actionsHtml}
            </div>
        </div>
    `;
    
    document.getElementById('profilePosts').innerHTML = '<h3 style="margin:18px 0 14px;color:var(--text-primary);font-size:20px;">📝 Записи</h3>';
    const postsContainer = document.getElementById('profilePosts');
    const feed = document.createElement('div');
    feed.id = 'profileFeed';
    postsContainer.appendChild(feed);
    const origView = viewingProfile;
    await loadWall();
    viewingProfile = origView;
}

async function addFriendAction(login) {
    await sendFriendRequest(currentUser, login);
    viewProfile(login);
    updateBadges();
}

async function removeFriendAction(login) {
    if (confirm(`Удалить ${login} из друзей?`)) {
        await removeFriend(currentUser, login);
        viewProfile(login);
        updateBadges();
    }
}

async function showFriendsList(login) {
    viewingProfile = login;
    switchTab('friends');
    await renderFriends(login);
}

// ============================================================
//  ГРУППЫ (СОКРАЩЕННО)
// ============================================================
async function renderGroups() {
    await loadGroups();
    const container = document.getElementById('groupsList');
    if (!allGroups.length) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:48px;">👥 Групп пока нет. Создайте первую!</div>';
        return;
    }
    container.innerHTML = '';
    for (const g of allGroups) {
        const card = document.createElement('div');
        card.className = 'group-card';
        const isMember = g.members && g.members.includes(currentUser);
        const isCreator = g.creator === currentUser;
        
        const icon = document.createElement('div');
        icon.className = 'group-icon';
        icon.style.background = getAvatarColor(g.name);
        icon.textContent = g.name.charAt(0).toUpperCase();
        
        const name = document.createElement('div');
        name.className = 'group-name';
        name.textContent = g.name;
        
        const members = document.createElement('div');
        members.className = 'group-members';
        members.textContent = `👥 ${g.members ? g.members.length : 0} / 100 участников`;
        
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        if (isMember) {
            btn.textContent = 'Выйти';
            btn.className += ' leave';
            btn.onclick = async (e) => {
                e.stopPropagation();
                g.members = g.members.filter(m => m !== currentUser);
                await db.put('groups', g);
                renderGroups();
            };
        } else if (g.members && g.members.length >= 100) {
            btn.textContent = '🚫 Полно';
            btn.style.background = 'var(--border)';
            btn.style.color = 'var(--text-muted)';
            btn.disabled = true;
        } else {
            btn.textContent = '➕ Вступить';
            btn.className += ' join';
            btn.onclick = async (e) => {
                e.stopPropagation();
                if (!g.members) g.members = [];
                if (!g.members.includes(currentUser) && g.members.length < 100) {
                    g.members.push(currentUser);
                    await db.put('groups', g);
                    renderGroups();
                }
            };
        }
        
        if (isCreator) {
            const delBtn = document.createElement('button');
            delBtn.className = 'group-delete';
            delBtn.textContent = '🗑️';
            delBtn.onclick = async (e) => {
                e.stopPropagation();
                if (confirm(`Удалить группу "${g.name}"?`)) {
                    await db.delete('groups', g.id);
                    renderGroups();
                }
            };
            card.appendChild(delBtn);
        }
        
        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(members);
        card.appendChild(btn);
        
        card.onclick = () => {
            viewGroupPosts(g.name);
        };
        
        container.appendChild(card);
    }
}

        authorSpan.onclick = () => { viewProfile(p.author); };
        info.appendChild(authorSpan);
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = p.time;
        info.appendChild(timeSpan);
        header.appendChild(info);
        div.appendChild(header);
        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = p.text;
        div.appendChild(text);
        const tag = document.createElement('div');
        tag.className = 'group-tag';
        tag.textContent = '📌 ' + p.group;
        div.appendChild(tag);
        feed.appendChild(div);
    }
}

document.getElementById('createGroupBtn').addEventListener('click', async () => {
    const name = document.getElementById('groupNameInput').value.trim();
    const desc = document.getElementById('groupDescInput').value.trim();
    if (!name) { alert('Введите название группы'); return; }
    await loadGroups();
    if (allGroups.find(g => g.name.toLowerCase() === name.toLowerCase())) {
        alert('Группа с таким названием уже существует');
        return;
    }
    await db.put('groups', {
        name: name,
        description: desc || 'Новая группа',
        creator: currentUser,
        members: [currentUser],
        created: new Date().toLocaleString()
    });
    document.getElementById('groupNameInput').value = '';
    document.getElementById('groupDescInput').value = '';
    renderGroups();
});

// ============================================================
//  ПОИСК (СОКРАЩЕННО)
// ============================================================
document.getElementById('searchBtn').addEventListener('click', async () => {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const type = document.getElementById('searchType').value;
    const results = document.getElementById('searchResults');
    if (!query) { results.style.display = 'none'; return; }
    
    await loadUsers();
    await loadGroups();
    let items = [];
    
    if (type === 'all' || type === 'users') {
        const users = allUsers.filter(u => u.login.toLowerCase().includes(query) && u.login !== currentUser);
        items.push(...users.map(u => ({ type: 'user', data: u })));
    }
    if (type === 'all' || type === 'groups') {
        const groups = allGroups.filter(g => g.name.toLowerCase().includes(query));
        items.push(...groups.map(g => ({ type: 'group', data: g })));
    }
    
    if (!items.length) {
        results.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">😕 Ничего не найдено</div>';
        results.style.display = 'block';
        return;
    }
    
    results.innerHTML = items.map(item => {
        if (item.type === 'user') {
            const u = item.data;
            return `<div class="result-item" onclick="viewProfile('${u.login}')">
                <div class="avatar" style="background:${getAvatarColor(u.login)}">${getInitials(u.login)}</div>
                <div class="info"><div class="name">${u.login}</div><div class="desc">👤 Пользователь</div></div>
            </div>`;
        } else {
            const g = item.data;
            return `<div class="result-item" onclick="viewGroupPosts('${g.name}')">
                <div class="avatar" style="background:${getAvatarColor(g.name)}">${g.name.charAt(0).toUpperCase()}</div>
                <div class="info"><div class="name">${g.name}</div><div class="desc">👥 ${g.members ? g.members.length : 0} участников</div></div>
            </div>`;
        }
    }).join('');
    results.style.display = 'block';
});

// ============================================================
//  МЕССЕНДЖЕР
// ============================================================
async function loadUserList() {
    await loadUsers();
    const list = document.getElementById('userList');
    const others = allUsers.filter(u => u.login !== currentUser);
    if (!others.length) {
        list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:14px;">👤 Нет других пользователей</div>';
        return;
    }
    list.innerHTML = '';
    for (const u of others) {
        const item = document.createElement('div');
        item.className = 'item' + (selectedChatUser === u.login ? ' active' : '');
        const av = document.createElement('div');
        renderAvatar(u.login, 40, av);
        item.appendChild(av);
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = u.login;
        item.appendChild(name);
        
        const msgs = await db.getAll('messages', 'chatKey', [currentUser, u.login].sort().join('_'));
        const unread = msgs.filter(m => m.to === currentUser && !m.read).length;
        if (unread) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = unread;
            item.appendChild(badge);
        }
        
        item.onclick = () => {
            selectedChatUser = u.login;
            loadUserList();
            loadChat();
        };
        list.appendChild(item);
    }
}

async function loadChat() {
    const container = document.getElementById('chatMessages');
    if (!selectedChatUser) {
        container.innerHTML = '<div class="empty"><span class="icon">💬</span>Выберите собеседника</div>';
        return;
    }
    const chatKey = [currentUser, selectedChatUser].sort().join('_');
    const msgs = await db.getAll('messages', 'chatKey', chatKey);
    
    for (const m of msgs) {
        if (m.to === currentUser && !m.read) {
            m.read = true;
            await db.put('messages', m);
        }
    }
    
    container.innerHTML = '';
    for (const m of msgs) {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.from === currentUser ? 'out' : 'in');
        div.innerHTML = `${m.text}<div class="meta">${m.from} • ${m.time}</div>`;
        container.appendChild(div);
    }
    container.scrollTop = container.scrollHeight;
}

document.getElementById('sendMsgBtn').addEventListener('click', async () => {
    if (!selectedChatUser) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    await db.put('messages', {
        from: currentUser,
        to: selectedChatUser,
        chatKey: [currentUser, selectedChatUser].sort().join('_'),
        text: text,
        time: new Date().toLocaleString(),
        read: false
    });
    input.value = '';
    loadChat();
    loadUserList();
});

// ============================================================
//  ВКЛАДКИ
// ============================================================
function switchTab(tab) {
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('wallPanel').style.display = tab === 'wall' ? 'block' : 'none';
    document.getElementById('profilePanel').style.display = tab === 'profile' ? 'block' : 'none';
    document.getElementById('friendsPanel').style.display = tab === 'friends' ? 'block' : 'none';
    document.getElementById('groupsPanel').style.display = tab === 'groups' ? 'block' : 'none';
    document.getElementById('messagesPanel').style.display = tab === 'messages' ? 'block' : 'none';
    
    if (tab === 'wall') {
        if (!viewingProfile) loadWall();
        else loadWall();
    }
    if (tab === 'profile') {
        if (!viewingProfile) viewProfile(currentUser);
        else viewProfile(viewingProfile);
    }
    if (tab === 'friends') {
        if (showRequests) {
            renderFriendRequests();
        } else {
            renderFriends(viewingProfile || currentUser);
        }
    }
    if (tab === 'groups') renderGroups();
    if (tab === 'messages') { loadUserList(); loadChat(); }
}

document.querySelectorAll('.nav button').forEach(btn => {
    btn.addEventListener('click', () => {
        if (btn.dataset.tab === 'profile' && !viewingProfile) {
            viewingProfile = currentUser;
        }
        if (btn.dataset.tab === 'friends') {
            showRequests = false;
            document.getElementById('showAllFriends').style.background = 'var(--gradient)';
            document.getElementById('showAllFriends').style.color = 'white';
            document.getElementById('showFriendRequests').style.background = 'transparent';
            document.getElementById('showFriendRequests').style.color = 'var(--text-secondary)';
        }
        switchTab(btn.dataset.tab);
    });
});

document.getElementById('userCard').addEventListener('click', () => {
    viewingProfile = currentUser;
    switchTab('profile');
});

document.getElementById('registerBtn').onclick = async () => {
    const login = document.getElementById('loginInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    if (!login || !pass) { document.getElementById('authMessage').textContent = 'Заполните оба поля'; return; }
    const ok = await register(login, pass);
    document.getElementById('authMessage').textContent = ok ? '✅ Аккаунт создан!' : '❌ Пользователь уже существует';

document.getElementById('sidebarAvatar').addEventListener('click', async (e) => {
    e.stopPropagation();
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const dataUrl = ev.target.result;
            await setAvatar(currentUser, dataUrl);
            renderAvatar(currentUser, 56, document.getElementById('sidebarAvatar'));
            loadWall();
            loadUserList();
            if (viewingProfile === currentUser) viewProfile(currentUser);
        };
        reader.readAsDataURL(file);
    };
    input.click();
});

})();
