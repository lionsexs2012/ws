version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wond_user
      POSTGRES_PASSWORD: wond_password
      POSTGRES_DB: wond_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wond_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wond_network
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wond_db
      DB_USER: wond_user
      DB_PASSWORD: wond_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      - .env
    networks:
      - wond_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  wond_network:
    driver: bridge
